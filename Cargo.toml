[package]
name = "seiren-control"
version = "2.0.0"
edition = "2021"
rust-version = "1.96"
description = "Control panel for the Razer Seiren V3 Chroma on Linux"
license = "MIT"
repository = "https://github.com/TheSiriuss/seiren-control"
readme = "README.md"
keywords = ["razer", "seiren", "microphone", "linux", "hid"]
categories = ["multimedia::audio", "hardware-support"]

[dependencies]
slint = { version = "1.18", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "compat-1-2", "unstable-winit-030"] }
libc = "0.2"
realfft = "3"
hound = "3"
ebur128 = "0.1"
nnnoiseless = { version = "0.5", default-features = false }
ndarray = "0.15"
deep_filter = { path = "vendor/libDF", default-features = false, features = ["tract", "default-model"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
i-slint-backend-testing = "1.18"

[build-dependencies]
slint-build = "1.18"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 8
strip = true
